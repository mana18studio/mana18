<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MANA18 | Integrated Growth Partner</title>
    <style>
        /* --- RESET & TYPOGRAPHY --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #050505;
            --text-color: #F0F0F0;
            --sub-color: #888888;
            --highlight-color: #FFFFFF;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* MODERN GRADIENT DEFINITION */
            /* Cyan to Violet to Blue - represents Ocean & Creativity */
            --brand-gradient: linear-gradient(135deg, #00C6FF 0%, #9D50BB 50%, #0072FF 100%);
        }

        html {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: flex-start;
            flex-shrink: 0;
        }

        .nav-logo {
            font-size: 1rem;
            letter-spacing: 0.2em;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .nav-logo:hover {
            opacity: 0.7;
        }

        /* --- HERO SECTION --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 2rem;
        }

        /* LOGO SVG ANIMATION */
        .logo-container {
            width: 160px;
            height: 160px;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) forwards;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- H1 WITH MODERN GRADIENT FADE --- */
        h1 {
            font-size: 7.5rem;
            font-weight: 700; /* Made slightly bolder to show off color */
            letter-spacing: -0.04em;
            line-height: 0.9;
            margin-bottom: 1.5rem;
            
            /* Gradient Text Styling */
            background: var(--brand-gradient);
            background-size: 200% auto; /* Allows movement */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent; /* Fallback */
            
            /* Animations */
            opacity: 0; /* Starts hidden for fadeUp */
            animation: fadeUp 1.5s var(--ease) 0.3s forwards, gradientMove 5s linear infinite;
        }

        /* TAGLINE */
        .tagline {
            font-size: 1.1rem;
            color: var(--sub-color);
            max-width: 650px;
            line-height: 1.5;
            margin-bottom: 2.5rem;
            font-weight: 400;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.5s forwards;
        }

        /* LOCATIONS LIST */
        .locations-list {
            font-size: 1.1rem;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            line-height: 1.6;
            max-width: 900px;
            margin-bottom: 3.5rem; 
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.7s forwards; 
        }

        .locations-list span {
            transition: color 0.3s ease;
            cursor: default;
        }

        .locations-list span:hover {
            color: var(--highlight-color);
        }

        /* --- CONTACT BUTTON WITH GRADIENT HOVER --- */
        .contact-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--sub-color);
            padding: 1.2rem 3.5rem; 
            font-size: 1rem;    
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.5s var(--ease);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 1;
            overflow: hidden; /* For hover effect */
            
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.9s forwards; 
        }

        .contact-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--brand-gradient);
            background-size: 200% auto;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.5s ease;
        }

        .contact-btn:hover {
            border-color: transparent; /* Let gradient show */
            color: #fff;
            transform: translateY(-2px);
        }

        .contact-btn:hover::before {
            opacity: 1;
            animation: gradientMove 5s linear infinite;
        }

        .contact-btn:active {
            transform: scale(0.98);
        }

        /* --- FOOTER --- */
        footer {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .footer-text, .footer-email {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--sub-color);
            opacity: 0; 
            animation: fadeUp 1.5s var(--ease) 1.2s forwards; 
        }

        .footer-email {
            text-decoration: none;
            transition: color 0.3s ease;
            text-align: right;
        }

        .footer-email:hover {
            color: var(--text-color);
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 768px) {
            nav { padding: 2rem 1.5rem; }
            footer { padding: 2rem 1.5rem; flex-direction: column; gap: 1rem; }
            
            .footer-text { order: 2; }
            .footer-email { order: 1; margin-bottom: 0.5rem; }

            .logo-container { width: 130px; height: 130px; margin-bottom: 1.5rem; }
            h1 { font-size: 4.5rem; margin-bottom: 1rem; }
            .tagline { font-size: 0.95rem; margin-bottom: 2rem; padding: 0 1rem; }
            .locations-list { font-size: 0.9rem; padding: 0 0.5rem; margin-bottom: 3rem; line-height: 1.8; }
            .contact-btn { padding: 1.1rem 3rem; font-size: 0.9rem; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .logo-container { width: 90px; height: 90px; margin-bottom: 0.5rem; }
            h1 { font-size: 3rem; margin-bottom: 0.5rem; }
            .tagline { font-size: 0.8rem; margin-bottom: 1rem; max-width: 80%; }
            .locations-list { margin-bottom: 1rem; font-size: 0.7rem; }
            footer { padding: 1rem 2rem; flex-direction: row; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="https://mana18.com" class="nav-logo">MANA18</a>
    </nav>

    <main>
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" />
                
                <path d="M20 50 L50 15 L80 50" />
                <path d="M35 50 L50 32 L65 50" />
                
                <path d="M25 60 Q 37.5 55, 50 60 T 75 60" />
                <path d="M25 70 Q 37.5 65, 50 70 T 75 70" />
                <path d="M35 80 Q 42.5 75, 50 80 T 65 80" />
            </svg>
        </div>

        <h1>MANA18</h1>
        
        <p class="tagline">
            A modern creative studio producing premium social content for high-end travel and destination brands across the Pacific and Southeast Asia.
        </p>

        <div class="locations-list">
            <span>French Polynesia</span> &middot; 
            <span>Hawaii</span> &middot; 
            <span>Fiji</span> &middot; 
            <span>Thailand</span> &middot; 
            <span>Vietnam</span> &middot; 
            <span>Indonesia</span>
        </div>

        <a href="mailto:studio@mana18.com" class="contact-btn">Contact Us</a>
    </main>

    <footer>
        <div class="footer-text">&copy; 2025 MANA18 LONDON</div>
        <a href="mailto:studio@mana18.com" class="footer-email">studio@mana18.com</a>
    </footer>

</body>
</html>
