<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MANA18 | Integrated Growth Partner</title>
    <style>
        /* --- RESET & TYPOGRAPHY --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #050505;
            --bg-light: #121212;
            --text-color: #F0F0F0;
            --sub-color: #999999;
            --highlight-color: #FFFFFF;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* MODERN GRADIENT & GLOW */
            --brand-gradient: linear-gradient(135deg, #00C6FF 0%, #9D50BB 50%, #0072FF 100%);
            --glow-color: rgba(0, 198, 255, 0.3);
        }

        html {
            height: 100%;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-light) 0%, var(--bg-dark) 80%);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-left-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .nav-logo {
            font-size: 1rem;
            letter-spacing: 0.2em;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
            transition: all 0.3s var(--ease);
            opacity: 0.9;
        }

        .lang-selector {
            font-size: 0.7rem;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 500;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.2s forwards;
        }

        .lang-selector span {
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .lang-selector span:hover {
            color: var(--highlight-color);
        }

        .nav-social-icon {
            color: var(--text-color);
            width: 24px; /* Slightly larger base size */
            height: 24px;
            transition: all 0.3s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
        }

        .nav-social-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* --- HERO SECTION --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 1rem 2rem;
        }

        .logo-container {
            width: 160px;
            height: 160px;
            margin-bottom: 2.5rem;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
        }

        .logo-svg path, .logo-svg circle {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawStroke 2.5s var(--ease) forwards;
        }

        h1 {
            font-size: 7.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 1.5rem;
            background: var(--brand-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 25px var(--glow-color));
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.5s forwards, gradientMove 8s linear infinite;
        }

        .tagline {
            font-size: 1.15rem;
            color: var(--sub-color);
            max-width: 680px;
            line-height: 1.6;
            letter-spacing: 0.02em;
            margin-bottom: 3rem;
            font-weight: 400;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.7s forwards;
        }

        .locations-list {
            font-size: 1.1rem;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            line-height: 1.8;
            max-width: 900px;
            margin-bottom: 4rem; 
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.9s forwards; 
        }

        .locations-list span {
            transition: all 0.3s ease;
            cursor: default;
            display: inline-block;
        }

        .locations-list span:hover {
            color: var(--highlight-color);
            transform: translateY(-2px);
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }

        .contact-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 1.2rem 3.5rem; 
            font-size: 1rem;    
            letter-spacing: 0.25em;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.6s var(--ease);
            position: relative;
            z-index: 1;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 1.1s forwards; 
        }

        .contact-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--brand-gradient);
            background-size: 200% auto;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
            transform: scale(1.1);
        }

        .contact-btn:hover {
            border-color: transparent;
            color: #fff;
            box-shadow: 0 10px 30px -10px var(--glow-color);
            transform: translateY(-3px);
        }

        .contact-btn:hover::before {
            opacity: 1;
            transform: scale(1);
            animation: gradientMove 8s linear infinite;
        }

        .contact-btn:active {
            transform: scale(0.98) translateY(-1px);
        }

        /* --- FOOTER --- */
        footer {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .footer-text, .footer-email {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--sub-color);
            opacity: 0; 
            animation: fadeUp 1.5s var(--ease) 1.3s forwards; 
        }

        .footer-email {
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes drawStroke {
            to { stroke-dashoffset: 0; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            /* Tighter Header */
            nav { padding: 1.5rem; }

            /* Optimized Main Content Spacing */
            main { 
                padding: 1rem 1.5rem; 
                justify-content: center;
            }

            /* Smaller Logo to save vertical space */
            .logo-container { 
                width: 90px; 
                height: 90px; 
                margin-bottom: 1.5rem; 
            }

            /* H1: Adjusted vw to fit perfectly without wrapping or hitting edges */
            h1 { 
                font-size: 13vw; 
                margin-bottom: 1rem; 
                filter: drop-shadow(0 0 10px var(--glow-color)); 
            }

            /* Tagline: Better line height for readability on small screens */
            .tagline { 
                font-size: 0.9rem; 
                line-height: 1.5;
                margin-bottom: 2rem; 
                padding: 0 0.5rem; 
            }

            /* Locations: Increased spacing between lines, slightly smaller text */
            .locations-list { 
                font-size: 0.8rem; 
                margin-bottom: 2.5rem; 
                line-height: 2; 
                padding: 0 1rem;
            }

            /* Button: Wider target for easier thumb tapping */
            .contact-btn { 
                width: 80%; 
                max-width: 320px;
                padding: 1.1rem 0;
                text-align: center;
                font-size: 0.9rem;
            }

            /* Footer: Clean vertical stack */
            footer { 
                padding: 1.5rem 1.5rem 2.5rem 1.5rem; /* Extra bottom padding for home bar */
                flex-direction: column; 
                gap: 1.5rem; 
            }
            
            .footer-right { order: 1; }
            .footer-left { order: 2; }
        }

        /* Landscape fix for short screens */
        @media (max-height: 600px) and (orientation: landscape) {
            .logo-container { width: 70px; height: 70px; margin-bottom: 0.5rem; }
            h1 { font-size: 4rem; margin-bottom: 0.5rem; }
            .tagline { display: none; }
            .locations-list { margin-bottom: 1rem; font-size: 0.7rem; }
            .contact-btn { padding: 0.8rem 2rem; }
            footer { padding: 0.5rem 2rem; flex-direction: row; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left-container">
            <a href="https://mana18.com" class="nav-logo">MANA18</a>
            <div class="lang-selector">
                <span>EN</span> &middot; <span>FR</span> &middot; <span>ES</span>
            </div>
        </div>

        <a href="#" class="nav-social-icon" aria-label="Instagram">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
            </svg>
        </a>
    </nav>

    <main>
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" />
                <path d="M20 50 L50 15 L80 50" />
                <path d="M35 50 L50 32 L65 50" />
                <path d="M25 60 Q 37.5 55, 50 60 T 75 60" />
                <path d="M25 70 Q 37.5 65, 50 70 T 75 70" />
                <path d="M35 80 Q 42.5 75, 50 80 T 65 80" />
            </svg>
        </div>

        <h1>MANA18</h1>
        
        <p class="tagline">
            A modern creative studio producing premium social content for high-end travel and destination brands across the Pacific and Southeast Asia.
        </p>

        <div class="locations-list">
            <span>French Polynesia</span> &middot; 
            <span>Hawaii</span> &middot; 
            <span>Fiji</span> &middot; 
            <span>Thailand</span> &middot; 
            <span>Vietnam</span> &middot; 
            <span>Indonesia</span>
        </div>

        <a href="mailto:studio@mana18.com" class="contact-btn">Contact Us</a>
    </main>

    <footer>
        <div class="footer-left">
            <div class="footer-text">&copy; 2025 MANA18 LONDON</div>
        </div>
        
        <div class="footer-right">
            <a href="mailto:studio@mana18.com" class="footer-email">studio@mana18.com</a>
        </div>
    </footer>

</body>
</html>
