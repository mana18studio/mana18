<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MANA18 | Integrated Growth Partner</title>
    <style>
        /* --- RESET & TYPOGRAPHY --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #050505;
            --text-color: #F0F0F0;
            --sub-color: #999999; /* Lightened slightly more for contrast */
            --highlight-color: #FFFFFF;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* MODERN GRADIENT: Cyan -> Violet -> Blue */
            --brand-gradient: linear-gradient(135deg, #00C6FF 0%, #9D50BB 50%, #0072FF 100%);
        }

        html {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            
            /* Layout Structure */
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            overflow-y: auto; /* Ensures scrolling if text gets too big */
        }

        /* --- NAVIGATION --- */
        nav {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: flex-start;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-logo {
            font-size: 1rem;
            letter-spacing: 0.2em;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        /* --- HERO SECTION --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertically Center */
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 1rem 2rem; 
        }

        /* LOGO SVG ANIMATION */
        .logo-container {
            width: 160px;
            height: 160px;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) forwards;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- TITLE --- */
        h1 {
            font-size: 7.5rem; /* Desktop */
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 1.5rem;
            
            /* Gradient */
            background: var(--brand-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.3s forwards, gradientMove 5s linear infinite;
        }

        /* TAGLINE */
        .tagline {
            font-size: 1.1rem;
            color: var(--sub-color);
            max-width: 650px;
            line-height: 1.5;
            margin-bottom: 2.5rem;
            font-weight: 400;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.5s forwards;
        }

        /* LOCATIONS LIST */
        .locations-list {
            font-size: 1.1rem;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            line-height: 1.6;
            max-width: 900px;
            margin-bottom: 3.5rem; 
            
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.7s forwards; 
        }

        .locations-list span {
            transition: color 0.3s ease;
            cursor: default;
        }

        .locations-list span:hover {
            color: var(--highlight-color);
        }

        /* CONTACT BUTTON */
        .contact-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--sub-color);
            padding: 1.2rem 3.5rem; 
            font-size: 1rem;    
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.5s var(--ease);
            position: relative;
            z-index: 1;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.9s forwards; 
        }

        .contact-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--brand-gradient);
            background-size: 200% auto;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.5s ease;
        }

        .contact-btn:hover {
            border-color: transparent;
            color: #fff;
            transform: translateY(-2px);
        }

        .contact-btn:hover::before {
            opacity: 1;
            animation: gradientMove 5s linear infinite;
        }

        .contact-btn:active {
            transform: scale(0.98);
        }

        /* --- FOOTER --- */
        footer {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .footer-text, .footer-email {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--sub-color);
            opacity: 0; 
            animation: fadeUp 1.5s var(--ease) 1.2s forwards; 
        }

        .footer-email {
            text-decoration: none;
            transition: color 0.3s ease;
            text-align: right;
        }

        .footer-email:hover {
            color: var(--text-color);
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- MOBILE OPTIMIZATION (THE FIX) --- */
        @media (max-width: 768px) {
            
            /* Navbar */
            nav { 
                padding: 1.5rem; 
                padding-bottom: 0; /* Save space at top */
            }

            .nav-logo { font-size: 1.1rem; } /* Bigger nav logo */

            /* Main Container */
            main { 
                padding: 1.5rem 1.5rem; 
                justify-content: flex-start; /* Start from top to prevent cutting off bottom */
                padding-top: 2rem;
            }

            /* Logo: Reduce size to give text more room */
            .logo-container { 
                width: 100px; 
                height: 100px; 
                margin-bottom: 1.5rem; 
            }

            /* H1: Keep it wide but manageable */
            h1 { 
                font-size: 16vw; 
                margin-bottom: 1.5rem; 
            }

            /* Tagline: SIGNIFICANTLY BIGGER */
            .tagline { 
                font-size: 1.15rem; /* Large reading size */
                line-height: 1.4;
                margin-bottom: 2rem; 
                padding: 0 0.5rem; 
                color: #bbbbbb; /* Brighter for readability */
            }

            /* Locations: SIGNIFICANTLY BIGGER */
            .locations-list { 
                font-size: 1.1rem; /* Much easier to see */
                margin-bottom: 2.5rem; 
                line-height: 1.6; 
                padding: 0 0.5rem;
            }

            /* Button: Bigger text */
            .contact-btn { 
                padding: 1.2rem 3rem; 
                font-size: 1.1rem;
                width: 100%; /* Full width button on mobile feels more modern */
                max-width: 300px;
            }

            /* Footer: Larger text */
            footer { 
                padding: 2rem 1.5rem; 
                flex-direction: column; 
                gap: 1rem; 
            }
            
            .footer-email, .footer-text { 
                font-size: 0.9rem; /* Bigger footer text */
                order: 1; 
            }
            .footer-text { order: 2; opacity: 0.5; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="https://mana18.com" class="nav-logo">MANA18</a>
    </nav>

    <main>
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" />
                <path d="M20 50 L50 15 L80 50" />
                <path d="M35 50 L50 32 L65 50" />
                <path d="M25 60 Q 37.5 55, 50 60 T 75 60" />
                <path d="M25 70 Q 37.5 65, 50 70 T 75 70" />
                <path d="M35 80 Q 42.5 75, 50 80 T 65 80" />
            </svg>
        </div>

        <h1>MANA18</h1>
        
        <p class="tagline">
            A modern creative studio producing premium social content for high-end travel and destination brands across the Pacific and Southeast Asia.
        </p>

        <div class="locations-list">
            <span>French Polynesia</span> &middot; 
            <span>Hawaii</span> &middot; 
            <span>Fiji</span> &middot; 
            <span>Thailand</span> &middot; 
            <span>Vietnam</span> &middot; 
            <span>Indonesia</span>
        </div>

        <a href="mailto:studio@mana18.com" class="contact-btn">Contact Us</a>
    </main>

    <footer>
        <div class="footer-text">&copy; 2025 MANA18 LONDON</div>
        <a href="mailto:studio@mana18.com" class="footer-email">studio@mana18.com</a>
    </footer>

</body>
</html>
