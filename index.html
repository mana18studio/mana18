<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MANA18 | Integrated Growth Partner</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Palette */
            --bg-dark: #020202;
            --bg-light: #141414;
            --text-color: #F2F2F2;
            --sub-color: #888888;
            --highlight-color: #FFFFFF;
            
            /* Typography */
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            
            /* Motion */
            --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
            
            /* Brand Gradient */
            --brand-gradient: linear-gradient(135deg, #00dbde 0%, #fc00ff 100%);
            --glow-color: rgba(0, 219, 222, 0.4);
        }

        html {
            height: 100%;
        }

        body {
            /* Deep, premium spotlight effect */
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
        }

        /* Noise Texture */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* --- NAVIGATION --- */
        nav {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
            z-index: 10;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .nav-left-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.6rem;
        }

        .nav-logo {
            font-size: 1rem;
            letter-spacing: 0.2em;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.3s var(--ease-out);
        }

        .nav-logo:hover {
            opacity: 0.7;
        }

        .lang-selector {
            font-size: 0.75rem;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            animation: fadeUp 1.2s var(--ease-out) 0.2s forwards;
        }

        .lang-selector span {
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
        }

        .lang-selector span:hover,
        .lang-selector span.active-lang {
            color: var(--highlight-color);
        }

        .lang-selector span.active-lang::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            background-color: var(--highlight-color);
            border-radius: 50%;
        }

        .nav-social-icon {
            color: var(--text-color);
            width: 22px;
            height: 22px;
            transition: transform 0.3s var(--ease-out), color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeUp 1.2s var(--ease-out) 0.4s forwards;
        }

        .nav-social-icon:hover {
            transform: translateY(-2px) scale(1.1);
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
        }

        .nav-social-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
        }

        /* --- HERO SECTION --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 1rem 2rem;
            z-index: 5;
        }

        /* LOCATIONS LIST (Top) */
        .locations-list {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.25em;
            line-height: 1.8;
            max-width: 900px;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeUp 1.2s var(--ease-out) 0.5s forwards;
        }

        .locations-list span {
            transition: color 0.4s ease, text-shadow 0.4s ease;
            cursor: default;
            display: inline-block;
        }

        .locations-list span:hover {
            color: var(--highlight-color);
            text-shadow: 0 0 12px rgba(255,255,255,0.5);
        }

        /* LOGO */
        .logo-container {
            width: clamp(80px, 15vw, 150px);
            height: clamp(80px, 15vw, 150px);
            margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 1;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
        }

        .logo-svg path, .logo-svg circle {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawStroke 2.2s var(--ease-out) 0.2s forwards;
        }

        /* H1 TITLE */
        h1 {
            font-size: clamp(3.5rem, 13vw, 8.5rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 0.9;
            margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
            
            background: var(--brand-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            
            filter: drop-shadow(0 0 30px var(--glow-color));
            
            opacity: 0;
            animation: fadeUp 1.2s var(--ease-out) 0.7s forwards, gradientMove 6s linear infinite;
        }

        /* TAGLINE */
        .tagline-container {
            width: 100%;
            /* Increased max-width to allow French text to stay on 2 lines */
            max-width: 950px; 
            /* Fixed min-height to reserve space for 2 lines */
            min-height: 3.6rem; 
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tagline {
            /* Adjusted clamp so text doesn't get too big and wrap */
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: var(--sub-color);
            line-height: 1.5;
            letter-spacing: 0.01em;
            font-weight: 300;
            margin: 0;
            text-wrap: balance;
            
            opacity: 0;
            animation: fadeUp 1.2s var(--ease-out) 0.9s forwards;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .fading-out {
            opacity: 0 !important;
            transform: translateY(5px);
        }

        /* BUTTON */
        .contact-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 1.2rem 4rem;
            font-size: 0.95rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: 100px;
            
            opacity: 0;
            animation: fadeUp 1.2s var(--ease-out) 1.1s forwards;
            transition: all 0.5s var(--ease-out);
            overflow: hidden;
            z-index: 1;
        }

        .contact-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--brand-gradient);
            background-size: 200% auto;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.5s ease;
            animation: gradientMove 6s linear infinite;
        }

        .contact-btn:hover {
            border-color: transparent;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 40px -10px var(--glow-color);
        }

        .contact-btn:hover::before {
            opacity: 1;
        }

        .contact-btn:active {
            transform: scale(0.96) translateY(-1px);
        }

        /* --- FOOTER --- */
        footer {
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .footer-text, .footer-email {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--sub-color);
            opacity: 0;
            animation: fadeUp 1.2s var(--ease-out) 1.3s forwards;
        }

        .footer-email {
            text-decoration: none;
            transition: color 0.3s ease;
            position: relative;
        }

        .footer-email::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--highlight-color);
            transition: width 0.3s var(--ease-out);
        }

        .footer-email:hover {
            color: var(--highlight-color);
        }
        
        .footer-email:hover::after {
            width: 100%;
        }

        /* --- KEYFRAMES --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes drawStroke {
            to { stroke-dashoffset: 0; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 768px) {
            nav { padding: 1.5rem; }
            main { padding: 1rem 1.5rem; }
            footer { padding: 1.5rem 1.5rem 2.5rem 1.5rem; flex-direction: column; gap: 1.5rem; }
            
            .footer-right { order: 1; }
            .footer-left { order: 2; }

            .locations-list {
                font-size: 0.7rem;
                letter-spacing: 0.15em;
                margin-bottom: 2rem;
                padding: 0 1rem;
            }

            h1 { filter: drop-shadow(0 0 15px var(--glow-color)); }

            .tagline-container { 
                /* Allow container to grow if needed on very small screens, 
                   but aim for 2 lines where possible */
                min-height: auto; 
                margin-bottom: 2.5rem;
                max-width: 100%;
            }
            
            .tagline {
                font-size: 0.9rem; /* Smaller font on mobile to fit text better */
            }

            .contact-btn {
                width: 100%;
                max-width: 300px;
                padding: 1.2rem 0;
            }
        }
        
        @media (max-height: 600px) and (orientation: landscape) {
            .logo-container { height: 60px; width: 60px; margin-bottom: 0.5rem; }
            h1 { margin-bottom: 0.5rem; }
            .tagline-container { display: none; }
            .locations-list { margin-bottom: 0.5rem; }
            .contact-btn { padding: 0.8rem 2rem; }
            footer { padding: 0.5rem 2rem; flex-direction: row; }
        }

    </style>
</head>
<body>

    <nav>
        <div class="nav-left-container">
            <a href="https://mana18.com" class="nav-logo">MANA18</a>
            <div class="lang-selector">
                <span class="active-lang" data-lang="EN">EN</span> &middot; 
                <span data-lang="FR">FR</span> &middot; 
                <span data-lang="ES">ES</span>
            </div>
        </div>

        <a href="#" class="nav-social-icon" aria-label="Instagram">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor"/>
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor"/>
                <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
            </svg>
        </a>
    </nav>

    <main>
        <div class="locations-list">
            <span>French Polynesia</span> &middot; 
            <span>Hawaii</span> &middot; 
            <span>Fiji</span> &middot; 
            <span>Thailand</span> &middot; 
            <span>Vietnam</span> &middot; 
            <span>Indonesia</span>
        </div>

        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" />
                <path d="M20 50 L50 15 L80 50" />
                <path d="M35 50 L50 32 L65 50" />
                <path d="M25 60 Q 37.5 55, 50 60 T 75 60" />
                <path d="M25 70 Q 37.5 65, 50 70 T 75 70" />
                <path d="M35 80 Q 42.5 75, 50 80 T 65 80" />
            </svg>
        </div>

        <h1>MANA18</h1>
        
        <div class="tagline-container">
            <p class="tagline" id="tagline-text">
                A modern creative studio producing premium social content for high-end travel and destination brands across the Pacific and Southeast Asia.
            </p>
        </div>

        <a href="mailto:studio@mana18.com" class="contact-btn" id="contact-btn-text">Contact Us</a>
    </main>

    <footer>
        <div class="footer-left">
            <div class="footer-text">&copy; 2025 MANA18 LONDON</div>
        </div>
        
        <div class="footer-right">
            <a href="mailto:studio@mana18.com" class="footer-email">studio@mana18.com</a>
        </div>
    </footer>

    <script>
        const translations = {
            EN: {
                text: "A modern creative studio producing premium social content for high-end travel and destination brands across the Pacific and Southeast Asia.",
                btn: "Contact Us"
            },
            FR: {
                text: "Un studio créatif moderne qui produit du contenu social premium pour des marques de voyage et de destinations haut de gamme à travers le Pacifique et l’Asie du Sud-Est.",
                btn: "Contactez-nous"
            },
            ES: {
                text: "Un estudio creativo moderno que produce contenido social premium para marcas de viajes y destinos de alta gama en todo el Pacífico y el Sudeste Asiático.",
                btn: "Nous contacter" 
            }
        };

        const langSpans = document.querySelectorAll('.lang-selector span[data-lang]');
        const tagline = document.getElementById('tagline-text');
        const contactBtn = document.getElementById('contact-btn-text');

        let currentLang = 'EN';

        langSpans.forEach(span => {
            span.addEventListener('click', function() {
                const selectedLang = this.getAttribute('data-lang');
                if (selectedLang === currentLang) return;

                langSpans.forEach(s => s.classList.remove('active-lang'));
                this.classList.add('active-lang');

                changeLanguage(selectedLang);
            });
        });

        function changeLanguage(lang) {
            tagline.classList.add('fading-out');
            contactBtn.classList.add('fading-out');

            setTimeout(() => {
                const content = translations[lang];
                
                tagline.textContent = content.text;
                contactBtn.textContent = content.btn;
                currentLang = lang;

                tagline.classList.remove('fading-out');
                contactBtn.classList.remove('fading-out');
            }, 400);
        }
    </script>

</body>
</html>
