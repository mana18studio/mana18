<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANA18 | Integrated Growth Partner</title>
    <style>
        /* --- RESET & TYPOGRAPHY --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #050505; /* Deepest Black */
            --text-color: #F0F0F0; /* Off-White for eye comfort */
            --sub-color: #666666; /* Darker Grey for subtle text */
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centered vertically */
            align-items: center;     /* Centered horizontally */
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* --- NAVIGATION (Brand Only) --- */
        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: center; /* Center the top logo mark if desired, or 'flex-start' for left */
            z-index: 10;
        }

        .nav-logo {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--sub-color);
            opacity: 0.8;
        }

        /* --- HERO SECTION --- */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 5;
        }

        /* LOGO SVG ANIMATION */
        .logo-container {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) forwards;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 1.2; /* Thinner stroke for elegance */
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.3s forwards;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--sub-color);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1.5s var(--ease) 0.5s forwards;
        }

        /* --- FOOTER --- */
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 2rem 3rem;
            display: flex;
            justify-content: center;
            font-size: 0.65rem;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0.6;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .logo-container { width: 150px; height: 150px; }
            nav { padding: 1.5rem; justify-content: center; }
            footer { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">MANA18</div>
    </nav>

    <main>
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" />
                
                <path d="M20 50 L50 15 L80 50" />
                <path d="M35 50 L50 32 L65 50" />
                
                <path d="M25 60 Q 37.5 55, 50 60 T 75 60" />
                <path d="M25 70 Q 37.5 65, 50 70 T 75 70" />
                <path d="M35 80 Q 42.5 75, 50 80 T 65 80" />
            </svg>
        </div>

        <h1>MANA18</h1>
    </main>

    <footer>
        <div>&copy; 2025</div>
    </footer>

</body>
</html>
