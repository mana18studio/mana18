<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANA18 | Integrated Growth Partner</title>
    <style>
        /* --- RESET & TYPOGRAPHY --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #050505; /* Deepest Black */
            --text-color: #F0F0F0; /* Off-White for eye comfort */
            --accent-color: #FFFFFF; /* Pure White for interaction */
            --sub-color: #888888; /* Grey for subtle text */
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden; /* Prevents scroll for the landing view */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .nav-logo {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-left: 2rem;
            transition: color 0.3s var(--ease);
        }

        .nav-links a:hover {
            color: var(--sub-color);
        }

        /* --- HERO SECTION --- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* LOGO SVG ANIMATION */
        .logo-container {
            width: 180px;
            height: 180px;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 1.2s var(--ease) forwards;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeUp 1.2s var(--ease) 0.2s forwards;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--sub-color);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeUp 1.2s var(--ease) 0.4s forwards;
        }

        /* --- CTA BUTTON --- */
        .cta-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            transition: all 0.4s var(--ease);
            opacity: 0;
            animation: fadeUp 1.2s var(--ease) 0.6s forwards;
        }

        .cta-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* --- FOOTER --- */
        footer {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            nav { padding: 1.5rem; }
            footer { padding: 1.5rem; flex-direction: column; gap: 10px; text-align: center; }
            .nav-links { display: none; } /* Simplified for mobile */
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">MANA18</div>
        <div class="nav-links">
            <a href="#">Work</a>
            <a href="#">Services</a>
            <a href="#">Studio</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main>
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" />
                
                <path d="M20 50 L50 15 L80 50" />
                <path d="M35 50 L50 32 L65 50" /> <path d="M25 60 Q 37.5 55, 50 60 T 75 60" />
                <path d="M25 70 Q 37.5 65, 50 70 T 75 70" />
                <path d="M35 80 Q 42.5 75, 50 80 T 65 80" />
            </svg>
        </div>

        <h1>MANA18</h1>
        <div class="subtitle">Untamed Beauty. Disciplined Growth.</div>
        
        <a href="mailto:hello@mana18.com" class="cta-btn">Enter The Site</a>
    </main>

    <footer>
        <div>Pacific First &mdash; Global Reach</div>
        <div>&copy; 2025 Mana18 Type Ltd.</div>
    </footer>

</body>
</html>
